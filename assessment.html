<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Eco assessment - EcoVerse</title>
    <link rel="icon" href="public/favicon.svg" />
    <link rel="stylesheet" href="css/ecoverse.css" />
  </head>
  <body data-page="assessment">
    <main id="main" class="workspace">
      <section class="page-heading assessment-heading">
        <p class="eyebrow">DISCOVER / ECO ASSESSMENT</p>
        <h1>Let's understand your<br /><em>everyday impact.</em></h1>
        <p>This is a practical starting profile, not a scientific carbon measurement. Answer honestly and EcoVerse will suggest where to begin.</p>
      </section>
      <form id="assessment-form" class="assessment-form">
        <div id="assessment-questions"></div>
        <p class="form-error" id="assessment-error" role="alert"></p>
        <button class="button button-dark" type="submit">Build my Eco Profile</button>
      </form>
    </main>
    <script type="module" src="js/assessment.js"></script>
  </body>
</html>
