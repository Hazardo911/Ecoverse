<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10221c" />
    <title>Explore — EcoVerse</title>
    <meta
      name="description"
      content="Grow a living digital forest through everyday sustainable actions."
    />
    <meta property="og:title" content="Explore — EcoVerse" />
    <meta property="og:description" content="Your actions. Grow a world." />
    <link rel="icon" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/ecoverse.css" />
  </head>
  <body data-page="explore">
    <main id="main">
      <section class="page-heading">
        <p class="eyebrow">A CONNECTED WORLD</p>
        <h1>Look closer.<br /><em>Everything is connected.</em></h1>
        <p>
          Explore the systems that keep our world alive—and the everyday choices
          that help protect them.
        </p>
      </section>
      <section class="content-section app-section">
        <div class="filters" id="topic-filters"></div>
        <div class="explore-layout">
          <div class="explore-world">
            <canvas
              id="explore-world"
              aria-label="Explore a woodland ecosystem"
            ></canvas>
          </div>
          <aside id="topic-panel" aria-live="polite"></aside>
        </div>
      </section>
    </main>
    <script type="module" src="js/explore.js"></script>
  </body>
</html>
