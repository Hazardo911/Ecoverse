<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10221c" />
    <title>Daily challenges — EcoVerse</title>
    <meta
      name="description"
      content="Grow a living digital forest through everyday sustainable actions."
    />
    <meta property="og:title" content="Daily challenges — EcoVerse" />
    <meta property="og:description" content="Your actions. Grow a world." />
    <link rel="icon" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/ecoverse.css" />
  </head>
  <body data-page="challenges">
    <main id="main">
      <section class="page-heading">
        <p class="eyebrow">YOUR DAILY FIELD GUIDE</p>
        <h1>Make today<br /><em>a little greener.</em></h1>
        <p>
          Record actions you have completed in real life. Each challenge renews
          daily at midnight UTC.
        </p>
      </section>
      <section class="content-section app-section">
        <div class="stat-strip">
          <div><strong id="points">—</strong><span>Eco Points</span></div>
          <div>
            <strong id="completed">—</strong><span>Actions recorded</span>
          </div>
          <div><strong id="level">—</strong><span>Forest level</span></div>
        </div>
        <div class="filters">
          <button class="active" data-filter="all">all</button
          ><button class="" data-filter="energy">energy</button
          ><button class="" data-filter="water">water</button
          ><button class="" data-filter="waste">waste</button
          ><button class="" data-filter="transport">transport</button
          ><button class="" data-filter="lifestyle">lifestyle</button>
        </div>
        <div id="challenge-grid" class="challenge-grid">
          <p class="loading-state">Loading your daily challenges…</p>
        </div>
      </section>
    </main>
    <script type="module" src="js/challenges.js"></script>
  </body>
</html>
