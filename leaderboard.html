<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#10221c" />
    <title>Leaderboard — EcoVerse</title>
    <meta
      name="description"
      content="Grow a living digital forest through everyday sustainable actions."
    />
    <meta property="og:title" content="Leaderboard — EcoVerse" />
    <meta property="og:description" content="Your actions. Grow a world." />
    <link rel="icon" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/ecoverse.css" />
  </head>
  <body data-page="leaderboard">
    <main id="main">
      <section class="page-heading">
        <p class="eyebrow">BETTER, TOGETHER</p>
        <h1>Many small actions.<br /><em>One shared world.</em></h1>
        <p>
          A community growing through action. Rankings reflect points recorded
          by real EcoVerse members.
        </p>
      </section>
      <section class="content-section app-section">
        <div class="filters">
          <button class="active" data-board="global">global</button
          ><button class="" data-board="weekly">weekly</button
          ><button class="" data-board="monthly">monthly</button>
        </div>
        <p class="period-note">
          Weekly and monthly rankings cover the last 7 and 30 days.
        </p>
        <div id="rank-list"><p class="loading-state">Loading rankings…</p></div>
      </section>
    </main>
    <script type="module" src="js/leaderboard.js"></script>
  </body>
</html>
